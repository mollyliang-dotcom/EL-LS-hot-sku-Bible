<script>
const DATA_URL = './data.json';
let products = [], filteredData = [], currentPage = 1;
const pageSize = 40;


const CB_TYPES = ['CNCB 1P', 'CNCB MP'];
const CNLS_TYPES = ['CNLS - Reg role only', 'CNLS - RM role', 'Local Others'];


function getSellerTypeGroup(sellerType) {
  if (CB_TYPES.indexOf(sellerType) !== -1) return 'CB';
  if (CNLS_TYPES.indexOf(sellerType) !== -1) return 'CNLS';
  return '';
}


function getFlagImgHtml(c) {
  if (!c || c.length !== 2) return '';
  return '<img class="flag-img" src="https://flagcdn.com/w40/' + c.toLowerCase() + '.png" alt="' + c + '" onerror="this.style.display=\\'none\\'">';
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}
const clean = function(s) { return (s || '').toString().replace(/[\\t"]/g, '').trim(); };
const toNum = function(s) { return parseFloat(clean(s).replace(/,/g, '').replace(/%/g, '')) || 0; };
const KNOWN_SITES = ['BR','MX','MY','PH','SG','TH','TW','VN'];
function normalizeSite(raw) {
  const s = clean(raw).toUpperCase();
  for (var i = 0; i < KNOWN_SITES.length; i++) {
    if (s === KNOWN_SITES[i] || s.indexOf(KNOWN_SITES[i]) !== -1) return KNOWN_SITES[i];
  }
  return s;
}


function normalizeItem(obj) {
  return {
    itemid:            clean(obj['item_id'] || ''),
    site:              normalizeSite(obj['grass_region'] || ''),
    shop_name:         clean(obj['shop_name'] || ''),
    item_name:          clean(obj['item_name'] || ''),
    l1:                clean(obj['cb_level1_global_be_category'] || ''),
    l2:                clean(obj['level2_global_be_category'] || ''),
    l3:                clean(obj['level3_global_be_category'] || ''),
    l4:                clean(obj['level4_global_be_category'] || ''),
    imgUrl:            clean(obj['item_image'] || ''),
    item_link:         clean(obj['item_link'] || ''),
    seller_type:       clean(obj['seller_type'] || ''),
    operation_type_l1: clean(obj['operation_type_l1'] || ''),
    cb_group:          clean(obj['cb_group'] || ''),
    cluster:           clean(obj['cluster'] || ''),
    update_time:       clean(obj['update_time'] || ''),
    ado:               toNum(obj['mtd_ado(SUM)'] || 0),
    ado_m1:            toNum(obj['m_1_ado(SUM)'] || 0),
    ado_mom:           toNum(obj['ado_mom'] || 0),
    ls_ado:            toNum(obj['mtd_ls_ado(SUM)'] || 0),
    ls_ado_m1:         toNum(obj['m_1_ls_ado(SUM)'] || 0),
    ls_ado_mom:        toNum(obj['ls_ado_mom'] || 0),
    adg_usd:           toNum(obj['mtd_adgmv_usd(SUM)'] || 0),
    adg_m1:            toNum(obj['m_1_adgmv_usd(SUM)'] || 0),
    adg_mom:           toNum(obj['adgmv_mom'] || 0),
    ls_adg_usd:        toNum(obj['mtd_ls_adgmv_usd(SUM)'] || 0),
    ls_adg_m1:         toNum(obj['m_1_ls_adgmv_usd(SUM)'] || 0),
    ls_adg_mom:        toNum(obj['ls_adgmv_mom'] || 0),
    ls_ams_spend:      toNum(obj['mtd_ls_ams_ad_spend_usd(SUM)'] || 0),
    ls_ams_adi:        toNum(obj['mtd_ls_ams_adi(SUM)'] || 0),
    ls_ams_adg:        toNum(obj['mtd_ls_ams_adgmv_usd(SUM)'] || 0),
    ls_ams_ado:        toNum(obj['mtd_ls_ams_ado(SUM)'] || 0),
  };
}


function toRangeStr(val, step) {
  var n = parseFloat(val);
  if (isNaN(n)) return null;
  if (n >= 0) { var lo = Math.floor(n/step)*step; return lo+'~'+(lo+step); }
  else { var hi = Math.ceil(n/step)*step; return (hi-step)+'~'+hi; }
}
function adoRange(v) {
  var n = parseFloat(v); if (isNaN(n)||n===0) return null;
  return toRangeStr(n, n<100?10:n<1000?50:100);
}
function adgRange(v) {
  var n = parseFloat(v); if (isNaN(n)||n===0) return null;
  return toRangeStr(n, n<100?10:n<500?50:n<2000?100:n<10000?500:1000);
}
function buildSparkline(momVal) {
  if (isNaN(momVal)||momVal===null) return '';
  var isPos=momVal>0, isZero=momVal===0;
  var color=isZero?'#9b8fa0':(isPos?'#27ae60':'#eb4d4b');
  var fill=isZero?'rgba(155,143,160,0.08)':(isPos?'rgba(39,174,96,0.10)':'rgba(235,77,75,0.10)');
  var W=64,H=28,mid=0.5,amp=Math.min(0.45,Math.max(0.05,Math.abs(momVal)/50*0.3));
  var endY=isZero?mid:(isPos?mid-amp:mid+amp);
  var ys=[mid,mid+(endY-mid)*0.1,mid+(endY-mid)*0.35,mid+(endY-mid)*0.7,endY];
  var coords=ys.map(function(y,i){return {x:+((i*W/(ys.length-1)).toFixed(1)),y:+(y*H).toFixed(1)};});
  var d='M'+coords[0].x+','+coords[0].y;
  for(var i=1;i<coords.length;i++){var cx=(coords[i-1].x+coords[i].x)/2;d+=' C'+cx+','+coords[i-1].y+' '+cx+','+coords[i].y+' '+coords[i].x+','+coords[i].y;}
  var last=coords[coords.length-1];
  var fillD=d+' L'+last.x+','+H+' L'+coords[0].x+','+H+' Z';
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+
    '<path d="'+fillD+'" fill="'+fill+'" stroke="none"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last.x+'" cy="'+last.y+'" r="2.2" fill="'+color+'"/>'+
    '</svg>';
}


function sortData(data, key) {
  var s = data.slice();
  if (key==='adoDesc')   s.sort(function(a,b){return b.ado-a.ado;});
  if (key==='adgDesc')   s.sort(function(a,b){return b.adg_usd-a.adg_usd;});
  if (key==='lsAdoDesc') s.sort(function(a,b){return b.ls_ado-a.ls_ado;});
  if (key==='lsAdgDesc') s.sort(function(a,b){return b.ls_adg_usd-a.ls_adg_usd;});
  if (key==='momDesc')   s.sort(function(a,b){return b.ls_ado_mom-a.ls_ado_mom;});
  if (key==='momAsc')    s.sort(function(a,b){return a.ls_ado_mom-b.ls_ado_mom;});
  return s;
}


async function loadData() {
  try {
    var res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var json = await res.json();
    var rawList = Array.isArray(json) ? json : (json.data || []);
    products = rawList.map(normalizeItem).filter(function(p){return p.itemid;});
    var d = new Date();
    document.getElementById('lastUpdateDisplay').textContent =
      '数据最后更新: ' + d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
    initFilters();
    applyFilters();
  } catch(e) {
    document.getElementById('productGrid').innerHTML =
      '<div class="loading-state">数据加载失败：' + e.message + '</div>';
  }
}


function initFilters() {
  var l1s=[], seen={};
  products.forEach(function(p){if(p.l1&&!seen[p.l1]){seen[p.l1]=1;l1s.push(p.l1);}});
  var el=document.getElementById('l1Filter');
  el.innerHTML='<option value="">L1 类目</option>';
  l1s.sort().forEach(function(v){el.innerHTML+='<option value="'+v+'">'+v+'</option>';});
  updateL2();
}


function updateL2() {
  var l1=document.getElementById('l1Filter').value;
  var el=document.getElementById('l2Filter');
  el.innerHTML='<option value="">L2 类目</option>';
  var seen={}, vals=[];
  products.filter(function(p){return !l1||p.l1===l1;}).forEach(function(p){if(p.l2&&!seen[p.l2]){seen[p.l2]=1;vals.push(p.l2);}});
  vals.sort().forEach(function(v){el.innerHTML+='<option value="'+v+'">'+v+'</option>';});
  updateL3();
}


function updateL3() {
  var l1=document.getElementById('l1Filter').value;
  var l2=document.getElementById('l2Filter').value;
  var el=document.getElementById('l3Filter');
  el.innerHTML='<option value="">L3 类目</option>';
  var seen={}, vals=[];
  products.filter(function(p){return (!l1||p.l1===l1)&&(!l2||p.l2===l2);})
    .forEach(function(p){if(p.l3&&!seen[p.l3]){seen[p.l3]=1;vals.push(p.l3);}});
  vals.sort().forEach(function(v){el.innerHTML+='<option value="'+v+'">'+v+'</option>';});
}


function render(dataList, page) {
  page=page||1; currentPage=page;
  var grid=document.getElementById('productGrid');
  grid.innerHTML='';
  var pageData=dataList.slice((page-1)*pageSize, page*pageSize);
  if(!pageData.length){grid.innerHTML='<div class="loading-state">没有找到符合条件的商品</div>';renderPagination(0);return;}
  pageData.forEach(function(item){
    var flagHtml=getFlagImgHtml(item.site);
    var adoRangeStr=adoRange(item.ado);

function hierarchy(){if($('l3Filter').value)return['site','站点'];if($('l2Filter').value)return['l3','L3'];if($('l1Filter').value)return['l2','L2'];return['l1','L1']}
function renderBubbles(rows){const palette={BR:'#FFB5A7',MX:'#FCD5CE',MY:'#F9DCC4',PH:'#CDEAC0',SG:'#BDE0FE',TH:'#A2D2FF',TW:'#CDB4DB',VN:'#FFC8DD',ID:'#D8E2DC'},sites=agg(rows,'site').filter(x=>x.name!=='未分类');if(!sites.length){$('siteBubble').innerHTML='<div class="empty">暂无数据</div>';return}const maxA=Math.max(...sites.map(x=>x.ado_i),1),maxG=Math.max(...sites.map(x=>x.adg_i),1);let c='';sites.forEach(s=>{const x=55+(s.ado_i/maxA)*460,y=285-(s.adg_i/maxG)*235,r=9+Math.sqrt((s.ado_i/maxA+s.adg_i/maxG)/2)*18,color=palette[s.name]||'#E6D6F5';c+=\`<circle class="bubble-dot" cx="\${x}" cy="\${y}" r="\${r}" fill="\${color}" style="fill:\${color}"><title>\${esc(s.name)} · 相对规模</title></circle><text class="bubble-label" x="\${x}" y="\${y+4}" text-anchor="middle">\${esc(s.name)}</text>\`});$('siteBubble').innerHTML=\`<svg viewBox="0 0 560 330"><line x1="48" y1="290" x2="525" y2="290" stroke="#eadfe4"/><line x1="48" y1="290" x2="48" y2="38" stroke="#eadfe4"/><text class="axis-label" x="480" y="315">LS ADO 相对高 →</text><text class="axis-label" x="12" y="50">LS ADGMV 相对高 ↑</text>\${c}</svg>\`}
function renderMatrix(rows){const palette=['#FFB5A7','#FCD5CE','#F9DCC4','#CDEAC0','#BDE0FE','#A2D2FF','#CDB4DB','#FFC8DD','#D8E2DC','#E8D7F1','#FDE2E4','#D0F4DE','#E2ECE9','#FFF1E6','#DDE5B6','#E4C1F9'],pts=agg(rows,'l1').filter(x=>x.name!=='未分类').sort((a,b)=>b.adg_i-a.adg_i);if(!pts.length){$('l1SiteMatrix').innerHTML='<div class="empty">暂无数据</div>';$('l1SiteLegend').innerHTML='';return}const maxA=Math.max(...pts.map(x=>x.ado_i),1),maxG=Math.max(...pts.map(x=>x.adg_i),1);let dots='';pts.forEach((p,i)=>{const x=55+(p.ado_i/maxA)*460,y=285-(p.adg_i/maxG)*235,r=8+Math.sqrt(((p.ado_i/maxA)+(p.adg_i/maxG))/2)*16,color=palette[i%palette.length],short=p.name.length>14?p.name.slice(0,14)+'…':p.name;dots+=\`<circle class="matrix-dot" cx="\${x}" cy="\${y}" r="\${r}" fill="\${color}"><title>\${esc(p.name)} · Total 相对规模</title></circle><text class="matrix-label" x="\${x}" y="\${y+3}" text-anchor="middle" style="fill:#4f4456;font-weight:700;font-size:8px;pointer-events:none">\${esc(short)}</text>\`});$('l1SiteMatrix').innerHTML=\`<svg viewBox="0 0 560 330"><line x1="48" y1="290" x2="525" y2="290" stroke="#eadfe4"/><line x1="48" y1="290" x2="48" y2="38" stroke="#eadfe4"/><text class="axis-label" x="480" y="315">LS ADO 相对高 →</text><text class="axis-label" x="12" y="50">LS ADGMV 相对高 ↑</text>\${dots}</svg>\`;$('l1SiteLegend').innerHTML='<span>汇总所有站点；每个气泡仅代表一个 L1 类目，颜色仅用于区分类目</span>'}
function renderKPIs(){const total=catFiltered('Total'),den=sum(total,'adg_i'),kol=sum(catFiltered('KOL'),'adg_i'),shop=sum(catFiltered('Shop'),'adg_i');$('kpiKolShare').textContent=fp(pct(kol,den));$('kpiShopShare').textContent=fp(pct(shop,den));const sites=agg(total,'site').sort((a,b)=>b.adg_i-a.adg_i),l1=agg(total,'l1').sort((a,b)=>b.adg_i-a.adg_i);$('kpiTopSite').textContent=sites[0]?fp(pct(sites[0].adg_i,den)):'—';$('kpiTopSiteSub').textContent=sites[0]?sites[0].name:'当前筛选';$('kpiTopL1').textContent=l1[0]?fp(pct(l1[0].adg_i,den)):'—';$('kpiTopL1Sub').textContent=l1[0]?l1[0].name:'当前筛选'}
function renderContribution(rows){const [key,label]=hierarchy(),groups=agg(rows,key).sort((a,b)=>b[currentMetric]-a[currentMetric]).slice(0,12),den=groups.reduce((a,g)=>a+g[currentMetric],0);$('categoryContributionTitle').textContent=label+' 类目贡献度';$('categoryBars').innerHTML=groups.map(g=>{const p=pct(g[currentMetric],den);return\`<div class="bar-row"><div class="bar-label" title="\${esc(g.name)}">\${esc(g.name)}</div><div class="bar-track"><div class="bar-fill" style="width:\${Math.max(p,1)}%"></div></div><div class="bar-value">\${fp(p)}</div></div>\`}).join('')||'<div class="empty">暂无数据</div>'}
function mom(c,p){return p>0?(c/p-1)*100:NaN}
function renderProducts(){const data=itemFiltered().filter(r=>(+r.adg_i||0)>0||(+r.ado_i||0)>0),rows=data.sort((a,b)=>b.adg_i-a.adg_i).slice(0,10);$('productTable').innerHTML=rows.map((p,i)=>{const mg=mom(+p.adg_i,+p.adg_m1_i),ma=mom(+p.ado_i,+p.ado_m1_i),cat=[p.l1,p.l2,p.l3].filter(Boolean).join(' › '),img=p.img?\`<img class="product-thumb" src="\${esc(p.img)}" loading="lazy" alt="产品图片" onerror="this.style.display='none'">\`:'—',adgShare=pct(+p.adg_i,+p.adg_total_i),adoShare=pct(+p.ado_i,+p.ado_total_i);return\`<tr><td><span class="rank">\${i+1}</span></td><td>\${img}</td><td><div class="product-name" style="font-family:monospace">\${esc(p.itemid)}</div></td><td>\${esc(p.site)}</td><td><div class="cat-path">\${esc(cat)}</div></td><td>\${esc(p.op||'—')}</td><td>\${fp(adgShare)}<div class="mini-track"><div class="mini-fill" style="width:\${Math.min(adgShare,100)}%"></div></div></td><td>\${fp(adoShare)}</td><td>\${Number.isFinite(ma)?(ma>0?'+':'')+fp(ma):'—'}</td><td>\${Number.isFinite(mg)?(mg>0?'+':'')+fp(mg):'—'}</td></tr>\`}).join('')||'<tr><td colspan="10" class="empty">暂无符合条件的产品</td></tr>'}
function renderSide(rows){const sites=agg(rows,'site').sort((a,b)=>b.adg_i-a.adg_i),den=sum(rows,'adg_i');$('siteBars').innerHTML=sites.map(g=>{const p=pct(g.adg_i,den);return\`<div class="bar-row"><div class="bar-label">\${esc(g.name)}</div><div class="bar-track"><div class="bar-fill" style="width:\${Math.max(p,1)}%"></div></div><div class="bar-value">\${fp(p)}</div></div>\`}).join('')||'<div class="empty">暂无数据</div>';const [key,label]=hierarchy(),groups=agg(rows,key).sort((a,b)=>b.adg_i-a.adg_i),arr=[];if(groups[0])arr.push(\`<div class="insight"><strong>\${label} 规模领先：</strong>\${esc(groups[0].name)}，LS ADGMV 贡献 \${fp(pct(groups[0].adg_i,den))}。</div>\`);if(sites[0])arr.push(\`<div class="insight"><strong>核心站点：</strong>\${esc(sites[0].name)}，贡献当前筛选 \${fp(pct(sites[0].adg_i,den))} 的 LS ADGMV。</div>\`);$('insights').innerHTML=arr.join('')||'<div class="empty">暂无数据</div>'}
function render(){const rows=catFiltered(),bubbles=bubbleRows();renderBubbles(bubbles);renderMatrix(bubbles);renderKPIs();renderContribution(rows);renderProducts();renderSide(rows)}
function refillCats(){const site=$('siteFilter').value,seller=$('sellerFilter').value,op=$('operationFilter').value||'Total';const base=categoryRows.filter(r=>(!site||r.site===site)&&(!seller||r.seller===seller)&&r.op===op);const old1=$('l1Filter').value,old2=$('l2Filter').value,old3=$('l3Filter').value;const fill=(id,vals,label,old)=>{$(id).innerHTML=\`<option value="">全部 \${label}</option>\`+[...new Set(vals.filter(Boolean))].sort().map(v=>\`<option value="\${esc(v)}">\${esc(v)}</option>\`).join('');if([...$(id).options].some(o=>o.value===old))$(id).value=old};fill('l1Filter',base.map(r=>r.l1),'L1',old1);const b2=base.filter(r=>!$('l1Filter').value||r.l1===$('l1Filter').value);fill('l2Filter',b2.map(r=>r.l2),'L2',old2);const b3=b2.filter(r=>!$('l2Filter').value||r.l2===$('l2Filter').value);fill('l3Filter',b3.map(r=>r.l3),'L3',old3)}
function initFilters(){[...new Set(categoryRows.map(r=>r.site).filter(Boolean))].sort().forEach(v=>$('siteFilter').insertAdjacentHTML('beforeend',\`<option>\${esc(v)}</option>\`));refillCats();['siteFilter','sellerFilter','operationFilter'].forEach(id=>$(id).addEventListener('change',()=>{refillCats();render()}));$('l1Filter').addEventListener('change',()=>{$('l2Filter').value='';$('l3Filter').value='';refillCats();render()});$('l2Filter').addEventListener('change',()=>{$('l3Filter').value='';refillCats();render()});$('l3Filter').addEventListener('change',render);$('resetBtn').addEventListener('click',()=>{['siteFilter','sellerFilter','operationFilter','l1Filter','l2Filter','l3Filter'].forEach(id=>$(id).value='');refillCats();render()});document.querySelectorAll('.contrib-toggle').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.contrib-toggle').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentMetric=b.dataset.metric;renderContribution(catFiltered())}))}
async function load(){try{const [c,i]=await Promise.all([fetch(CATEGORY_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('category_data '+r.status);return r.json()}),fetch(ITEM_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('item_data '+r.status);return r.json()})]);categoryRows=c.rows||[];itemRows=i.rows||[];if(!categoryRows.length)throw Error('类目数据无可用数据');initFilters();render();const months=[...new Set(categoryRows.map(r=>r.month).filter(Boolean))].sort();const updates=[...new Set(itemRows.map(r=>(r.update||'').slice(0,10)).filter(Boolean))].sort();$('lastUpdate').textContent='数据周期: '+((months.at(-1)||'—').slice(0,10))+' · 产品更新: '+(updates.at(-1)||'—')}catch(e){$('categoryBars').innerHTML='<div class="empty">数据加载失败：'+esc(e.message)+'</div>';$('lastUpdate').textContent='数据加载失败'}}
window.addEventListener('load',load);
<\/script></body></html>
`;

function withBase(htmlText) {
  const baseHref = new URL('.', window.location.href).href;
  if (/<head[^>]*>/i.test(htmlText)) {
    return htmlText.replace(/<head([^>]*)>/i, '<head$1><base href="' + baseHref + '">');
  }
  return '<base href="' + baseHref + '">' + htmlText;
}

document.getElementById('skuFrame').srcdoc = withBase(HOT_SKU_HTML);
document.getElementById('categoryFrame').srcdoc = withBase(CATEGORY_HTML);

function switchPage(page) {
  const sku = page === 'sku';
  document.getElementById('skuFrame').classList.toggle('active', sku);
  document.getElementById('categoryFrame').classList.toggle('active', !sku);
  history.replaceState(null, '', sku ? '#sku' : '#category');
}

if (location.hash === '#category') switchPage('category');
</script>
