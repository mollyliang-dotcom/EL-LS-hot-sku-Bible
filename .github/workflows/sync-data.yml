name: Sync Sheet Data
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CSV and convert to JSON
        run: |
          python3 << 'EOF'
          import csv, json, urllib.request, io

          def fetch_json(url, label):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      if r.status != 200:
                          raise Exception(f"HTTP {r.status}")
                      content = r.read().decode('utf-8-sig')
              except Exception as e:
                  print(f"ERROR {label}: {e}")
                  raise
              reader = csv.DictReader(
                  io.StringIO(content)
              )
              rows = list(reader)
              print(f"OK {label}: {len(rows)} rows")
              return rows

          data_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_iGV7eMPIih-3NYaS6akPERKKmuy9WFGTN4IUqEi0ZslYo2OyXePDyeU4DWhIuxrSGLghYpxE43Rd/pub?gid=105525607&single=true&output=csv"
          rows = fetch_json(data_url, "LS_DATA")
          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(rows, f, ensure_ascii=False)
          EOF

      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto sync data"
          git push
